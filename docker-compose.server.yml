services:
  openbook:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /app/data
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ADMIN_PHONES: ${ADMIN_PHONES:-+79781827502}
    volumes:
      - openbook-data:/app/data
    ports:
      - "4000:3000"
    labels:
      traefik.enable: "true"
      traefik.http.routers.openbook.rule: "Host(`nexora.shalter.ru`)"
      traefik.http.routers.openbook.entrypoints: "websecure"
      traefik.http.routers.openbook.tls: "true"
      traefik.http.services.openbook.loadbalancer.server.port: "3000"
    networks:
      default: {}
      dokploy-network:
        aliases:
          - nexora
          - openbook
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  openbook-data:

networks:
  dokploy-network:
    external: true
