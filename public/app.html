<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Nexora — social, on your terms</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231877f2'/><text x='16' y='23' font-size='20' fill='white' text-anchor='middle' font-family='Arial' font-weight='bold'>N</text></svg>" />
  <!-- Progressive Web App: installable to the home screen -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1877f2" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Nexora" />
  <meta name="mobile-web-app-capable" content="yes" />
  <script>try{var t=localStorage.getItem('ob_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- Top bar: left (logo + search), center (primary tabs), right (utility) -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="logo" data-nav="feed">
        <span class="brand-mark">N</span>
        <span class="brand name">Nexora</span>
      </div>
      <div class="search">
        <input type="text" id="searchInput" data-i18n-placeholder="search" placeholder="Search Nexora" autocomplete="off" />
      </div>
    </div>
    <nav class="nav-primary">
      <button class="nav-tab" data-nav="feed" title="Home"><span class="ti icon-home" aria-hidden="true"></span><span class="tl" data-i18n="home">Home</span></button>
      <button class="nav-tab" data-nav="communities" title="Communities"><span class="ti icon-users" aria-hidden="true"></span><span class="tl" data-i18n="communities">Communities</span></button>
      <button class="nav-tab" data-nav="marketplace" title="Marketplace"><span class="ti icon-bag" aria-hidden="true"></span><span class="tl" data-i18n="marketplace">Marketplace</span></button>
      <button class="nav-tab" data-nav="dashboard" title="Professional dashboard"><span class="ti icon-chart" aria-hidden="true"></span><span class="tl" data-i18n="dashboard">Dashboard</span></button>
    </nav>
    <div class="topbar-right">
      <button class="nav-btn lang-btn" id="langBtn" title="Change interface language" aria-label="Change interface language">RU</button>
      <button class="nav-btn translate-btn" id="translateBtn" title="Open translator" aria-label="Open translator">
        <span class="ti icon-language" aria-hidden="true"></span><span class="tl">Translate</span>
      </button>
      <button class="nav-btn theme-btn" id="themeBtn" title="Toggle light / dark mode" aria-label="Toggle light / dark mode">
        <span class="ti icon-moon" id="themeIcon" aria-hidden="true"></span><span class="tl" id="themeLabel" data-i18n="dark">Dark</span>
      </button>
      <button class="nav-btn" data-nav="messages" title="Messages" aria-label="Messages">
        <span class="ti icon-message" aria-hidden="true"></span><span class="badge hidden" id="messagesBadge">0</span>
      </button>
      <button class="nav-btn" id="notifBtn" title="Notifications" aria-label="Notifications">
        <span class="ti icon-bell" aria-hidden="true"></span><span class="badge hidden" id="notifBadge">0</span>
      </button>
      <button class="nav-btn account-trigger" id="meBtn" title="Account menu" aria-label="Open account menu" aria-expanded="false"></button>
    </div>
  </header>

  <!-- Account center: switching accounts always goes through the normal login flow;
       passwords and session tokens are never stored in the browser. -->
  <div class="account-menu hidden" id="accountMenu" role="menu" aria-label="Account menu">
    <div class="account-menu-head" id="accountMenuHead"></div>
    <div class="account-menu-divider"></div>
    <button class="account-menu-item" id="accountProfile" role="menuitem"><span class="menu-icon icon-user" aria-hidden="true"></span><span>View profile</span></button>
    <button class="account-menu-item" id="accountAdd" role="menuitem"><span class="menu-icon icon-plus" aria-hidden="true"></span><span>Add another account</span></button>
    <button class="account-menu-item account-menu-danger" id="accountLogout" role="menuitem"><span class="menu-icon icon-logout" aria-hidden="true"></span><span>Log out</span></button>
  </div>

  <!-- Notifications dropdown -->
  <div class="dropdown hidden" id="notifDropdown">
    <div class="dhead"><h3>Notifications</h3></div>
    <div id="notifList"></div>
  </div>

  <!-- Main app -->
  <div class="layout">
    <aside class="rail" id="leftRail"></aside>
    <main class="center" id="view"></main>
    <aside class="rail" id="rightRail"></aside>
  </div>

  <!-- Mobile-only bottom navigation (the primary destinations). -->
  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-tab" data-nav="feed" title="Home"><span class="ti icon-home" aria-hidden="true"></span><span class="tl" data-i18n="home">Home</span></button>
    <button class="nav-tab" data-nav="communities" title="Communities"><span class="ti icon-users" aria-hidden="true"></span><span class="tl" data-i18n="communities">Communities</span></button>
    <button class="nav-tab" data-nav="marketplace" title="Marketplace"><span class="ti icon-bag" aria-hidden="true"></span><span class="tl" data-i18n="market">Market</span></button>
    <button class="nav-tab" data-nav="dashboard" title="Dashboard"><span class="ti icon-chart" aria-hidden="true"></span><span class="tl" data-i18n="dashboard">Dashboard</span></button>
  </nav>

  <!-- Mount points for modals, toasts, story viewer -->
  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/webauthn.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/vidcompress.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
